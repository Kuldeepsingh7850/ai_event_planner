<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" rx="16" />
  
  <!-- Title -->
  <text x="40" y="45" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">JAGAH — Simple User Flow Diagram</text>
  <text x="40" y="65" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748B">Event planning, AI recommendations, and workflow management lifecycle</text>

  <!-- Flow Nodes -->
  <!-- Start -->
  <rect x="40" y="120" width="100" height="50" rx="25" fill="url(#blueGrad)" filter="url(#shadow)" />
  <text x="90" y="150" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Start</text>

  <!-- Homepage -->
  <rect x="190" y="120" width="140" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />
  <text x="260" y="150" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Landing Page</text>

  <!-- Login/Register -->
  <rect x="380" y="120" width="160" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />
  <text x="460" y="150" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Login / Registration</text>

  <!-- Dashboard -->
  <rect x="590" y="120" width="150" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />
  <text x="665" y="150" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">User Dashboard</text>

  <!-- Create Event -->
  <rect x="380" y="240" width="160" height="50" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#shadow)" />
  <text x="460" y="270" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#2563EB" text-anchor="middle">Create Event (AI/Manual)</text>

  <!-- Event Hub -->
  <rect x="590" y="240" width="150" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />
  <text x="665" y="270" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">Event Workspace</text>

  <!-- Sub Modules -->
  <!-- Guest List -->
  <rect x="60" y="380" width="160" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />
  <text x="140" y="410" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">👥 Guest RSVP Tracker</text>

  <!-- Budget -->
  <rect x="260" y="380" width="170" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />
  <text x="345" y="410" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">💰 Budget &amp; Expenses</text>

  <!-- Tasks -->
  <rect x="470" y="380" width="160" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />
  <text x="550" y="410" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">✅ Task Checklist</text>

  <!-- AI Chat -->
  <rect x="670" y="380" width="160" height="50" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5" filter="url(#shadow)" />
  <text x="750" y="410" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#7C3AED" text-anchor="middle">🪄 AI Chat Assistant</text>

  <!-- Connectors (Arrows) -->
  <!-- Start -> Landing -->
  <line x1="140" y1="145" x2="182" y2="145" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Landing -> Auth -->
  <line x1="330" y1="145" x2="372" y2="145" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Auth -> Dashboard -->
  <line x1="540" y1="145" x2="582" y2="145" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Dashboard -> Create Event -->
  <path d="M 665,170 L 665,205 L 460,205 L 460,232" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Create Event -> Event Hub -->
  <line x1="540" y1="265" x2="582" y2="265" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Event Hub -> Sub-modules (Tree branches) -->
  <path d="M 665,290 L 665,330 L 140,330 L 140,372" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 345,330 L 345,372" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 550,330 L 550,372" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 665,330 L 750,330 L 750,372" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)" />
</svg>
